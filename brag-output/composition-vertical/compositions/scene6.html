<!doctype html>
<html lang="en">
<head>
  
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>Scene 6 — Narendra Brand Lockup (9:16)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #000319;
      color: #f4f4f5;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #000319;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 120px 72px 140px 72px;
    }
    .bg-grid {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
      background-size: 64px 64px;
      opacity: 0.6;
      pointer-events: none;
    }
    .ambient-glow-emerald {
      position: absolute;
      width: 800px;
      height: 800px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 255, 153, 0.12) 0%, rgba(0, 3, 25, 0) 70%);
      top: -150px;
      right: -150px;
      pointer-events: none;
    }
    .ambient-glow-cyan {
      position: absolute;
      width: 800px;
      height: 800px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(6, 182, 212, 0.10) 0%, rgba(0, 3, 25, 0) 70%);
      bottom: -150px;
      left: -150px;
      pointer-events: none;
    }
    .top-nav-bar {
      position: absolute;
      top: 60px;
      left: 72px;
      right: 72px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 50;
      font-family: 'JetBrains Mono', monospace;
      font-size: 15px;
      letter-spacing: 0.08em;
      color: #a1a1aa;
    }
    .brand-mark {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      color: #ffffff;
      font-size: 18px;
      letter-spacing: -0.01em;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .brand-status-dot {
      width: 10px;
      height: 10px;
      background: #00ff99;
      border-radius: 50%;
      box-shadow: 0 0 12px #00ff99;
    }
    .system-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 100px;
      font-size: 13px;
      color: #d4d4d8;
    }
    .accent-emerald {
      color: #00ff99;
      text-shadow: 0 0 24px rgba(0, 255, 153, 0.4);
    }
    .accent-cyan {
      color: #38bdf8;
      text-shadow: 0 0 24px rgba(56, 189, 248, 0.4);
    }
    .accent-violet {
      color: #a78bfa;
      text-shadow: 0 0 24px rgba(167, 139, 250, 0.4);
    }
    .tag-mono {
      font-family: 'JetBrains Mono', monospace;
      font-size: 15px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #00ff99;
      margin-bottom: 24px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }
    .tag-mono::before {
      content: "";
      display: inline-block;
      width: 24px;
      height: 2px;
      background: #00ff99;
    }
  </style>

  <style>
    .outro-content {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 920px;
    }
    .outro-avatar-wrap {
      position: relative;
      width: 280px;
      height: 280px;
      margin-bottom: 40px;
    }
    .outro-avatar {
      width: 280px;
      height: 280px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #00ff99;
      box-shadow: 0 0 60px rgba(0, 255, 153, 0.4);
    }
    .outro-name {
      font-size: 88px;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: #ffffff;
      line-height: 1;
      margin-bottom: 18px;
    }
    .outro-role {
      font-size: 28px;
      font-weight: 600;
      color: #00ff99;
      letter-spacing: -0.01em;
      margin-bottom: 24px;
    }
    .outro-bio {
      font-size: 22px;
      color: #d4d4d8;
      max-width: 780px;
      line-height: 1.6;
      margin-bottom: 48px;
    }
    .outro-socials {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      max-width: 600px;
      margin-bottom: 44px;
    }
    .social-pill {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px 28px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.16);
      font-family: 'JetBrains Mono', monospace;
      font-size: 16px;
      color: #ffffff;
    }
    .outro-cta-badge {
      padding: 12px 28px;
      background: rgba(0, 255, 153, 0.12);
      border: 1px solid #00ff99;
      border-radius: 100px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      font-weight: 600;
      color: #00ff99;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <div id="root" data-composition-id="scene6" data-width="1080" data-height="1920">
    
  <div class="bg-grid"></div>
  <div class="ambient-glow-emerald" data-layout-allow-overflow="true"></div>
  <div class="ambient-glow-cyan" data-layout-allow-overflow="true"></div>
  <header class="top-nav-bar" data-layout-allow-overlap="true">
    <div class="brand-mark">
      <span class="brand-status-dot"></span>
      <span>NARENDRA</span>
    </div>
    <div class="system-badge">
      <span>REEL · 9:16</span>
    </div>
  </header>

    <div class="outro-content">
      <div class="outro-avatar-wrap">
        <img src="assets/img/narendra.jpg" alt="Narendra" class="outro-avatar" id="outro-avatar" />
      </div>
      <h1 class="outro-name">NARENDRA<span class="accent-emerald">.</span></h1>
      <div class="outro-role">Full Stack Software Engineer & Builder</div>
      <p class="outro-bio">
        Building resilient backends, interactive 3D simulations, and intuitive mobile products.
      </p>
      <div class="outro-socials">
        <div class="social-pill">
          <span class="accent-emerald">⚡</span>
          <span>github.com/Nairy1729</span>
        </div>
        <div class="social-pill">
          <span class="accent-cyan">in</span>
          <span>linkedin.com/in/nairykumar</span>
        </div>
        <div class="social-pill">
          <span class="accent-violet">✉</span>
          <span>narendra.kumarvg2@gmail.com</span>
        </div>
      </div>
      <div class="outro-cta-badge">AVAILABLE FOR HIGH-IMPACT ROLES & PRODUCT BUILDS</div>
    </div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#outro-avatar", { scale: 0.8, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.4)" }, 0.05);
    tl.fromTo(".outro-name", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.15);
    tl.fromTo(".outro-role", { opacity: 0, y: 15 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.25);
    tl.fromTo(".social-pill", { opacity: 0, y: 15 }, { opacity: 1, y: 0, duration: 0.4, stagger: 0.08, ease: "power2.out" }, 0.35);
    tl.fromTo(".outro-cta-badge", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.5)" }, 0.5);
    window.__timelines = window.__timelines || {};
    window.__timelines["scene6"] = tl;
    tl.seek(0);
  </script>
</body>
</html>
