<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <title>Narendra — Developer Reel (16:9)</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #000319;
    }
    #root {
      width: 1920px;
      height: 1080px;
      position: relative;
      overflow: hidden;
      background: #000319;
    }
  </style>
</head>
<body>
  <div
    id="root"
    data-composition-id="main"
    data-start="0"
    data-duration="28.0"
    data-width="1920"
    data-height="1080"
  >
    <!-- 6 Sub-Compositions mounted sequentially -->
    <div id="scene-card-1" data-composition-id="scene1" data-composition-src="compositions/scene1.html" data-start="0" data-duration="4.2"></div>
    <div id="scene-card-2" data-composition-id="scene2" data-composition-src="compositions/scene2.html" data-start="4.2" data-duration="4.0"></div>
    <div id="scene-card-3" data-composition-id="scene3" data-composition-src="compositions/scene3.html" data-start="8.2" data-duration="5.6"></div>
    <div id="scene-card-4" data-composition-id="scene4" data-composition-src="compositions/scene4.html" data-start="13.8" data-duration="6.4"></div>
    <div id="scene-card-5" data-composition-id="scene5" data-composition-src="compositions/scene5.html" data-start="20.2" data-duration="5.3"></div>
    <div id="scene-card-6" data-composition-id="scene6" data-composition-src="compositions/scene6.html" data-start="25.5" data-duration="2.5"></div>

    <!-- Background Music -->
    <audio id="bgm" data-start="0" data-duration="28.0" data-volume="0.18" src="assets/music/bgm.mp3"></audio>

    <!-- 6 Synchronized Voiceover Tracks -->
    <audio id="vo-1" data-start="0.1" data-duration="4.03" data-volume="1.0" src="assets/vo/vo_1.wav"></audio>
    <audio id="vo-2" data-start="4.3" data-duration="3.73" data-volume="1.0" src="assets/vo/vo_2.wav"></audio>
    <audio id="vo-3" data-start="8.3" data-duration="5.33" data-volume="1.0" src="assets/vo/vo_3.wav"></audio>
    <audio id="vo-4" data-start="13.9" data-duration="6.10" data-volume="1.0" src="assets/vo/vo_4.wav"></audio>
    <audio id="vo-5" data-start="20.3" data-duration="5.12" data-volume="1.0" src="assets/vo/vo_5.wav"></audio>
    <audio id="vo-6" data-start="25.5" data-duration="2.50" data-volume="1.0" src="assets/vo/vo_6.wav"></audio>

    <!-- Tactile Sound Effects (exact duration match) -->
    <audio id="sfx-roll2" data-start="0.1" data-duration="0.06" data-volume="0.6" src="assets/sfx/rollover2.ogg"></audio>
    <audio id="sfx-sw21" data-start="4.3" data-duration="0.41" data-volume="0.6" src="assets/sfx/switch21.ogg"></audio>
    <audio id="sfx-clk1" data-start="6.2" data-duration="0.09" data-volume="0.5" src="assets/sfx/click1.ogg"></audio>
    <audio id="sfx-sw16" data-start="8.3" data-duration="0.36" data-volume="0.6" src="assets/sfx/switch16.ogg"></audio>
    <audio id="sfx-drop" data-start="14.2" data-duration="0.11" data-volume="0.7" src="assets/sfx/drop_001.ogg"></audio>
    <audio id="sfx-clk2" data-start="16.5" data-duration="0.09" data-volume="0.5" src="assets/sfx/click1.ogg"></audio>
    <audio id="sfx-roll4" data-start="20.3" data-duration="0.11" data-volume="0.6" src="assets/sfx/rollover4.ogg"></audio>
    <audio id="sfx-sel8" data-start="25.5" data-duration="0.05" data-volume="0.7" src="assets/sfx/select_008.ogg"></audio>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    tl.to("#root", { duration: 28.0 }, 0);
    window.__timelines = window.__timelines || {};
    window.__timelines["main"] = tl;
    tl.seek(0);
  </script>
</body>
</html>
